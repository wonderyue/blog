# Portfolio content.
#
# /portfolio/ is generated from this file -- add a work here and it shows up,
# no HTML to touch. The page renders one section per entry in `categories`,
# in the order they appear below; a category with no works is skipped.
#
# Per work:
#   title     required for everything except drawings
#   category  must match an id in `categories`
#   cover     path under source/  (cards crop to 16:9, so wide images work best)
#   summary   one line under the title
#   tags      small pills on the card -- engine, language, platform, role
#   links     any number; the first one is the card's primary button
#   featured  true = card spans two columns on wide screens; use it sparingly
#   badge     small flag on the cover corner, e.g. "Coming 2027"
#
# In a `display: list` category, `cover` is optional and `tags`/`featured`/
# `badge` are ignored -- rows only show thumbnail, title, summary and links.

# `display` controls how a category is laid out:
#   (default)  cards  -- cover cropped to 16:9, title, summary, tags, links
#   list       compact rows: small or no thumbnail, name, one line, links.
#              For side projects that look overweight as full cards.
#   gallery    masonry columns at the image's own aspect ratio, no card frame.
#              For artwork, which must not be cropped to a fixed shape.
#
# Section order on the page is the order of this list.
categories:
  - id: shipped
    label: Work
  - id: indie
    label: Indie Games
  - id: tool
    label: Tools & Experiments
    display: list
  - id: drawing
    label: Drawings
    display: gallery

